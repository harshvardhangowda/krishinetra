services:
  krishinetra-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./krishnetra_backend.db
      - SECRET_KEY=${SECRET_KEY:-krishinetra-secure-production-random-token}
    volumes:
      - media_data:/app/data/media_evidence

volumes:
  media_data:
