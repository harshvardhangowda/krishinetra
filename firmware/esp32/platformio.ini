; PlatformIO Project Configuration File for Krishnetra ESP32 Firmware
; Platform: Espressif 32 (Arduino Framework)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D KRISHNETRA_SAFE_MODE=1
